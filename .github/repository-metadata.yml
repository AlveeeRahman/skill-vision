# Source of truth for everything a search engine sees about this repository.
#
# The GitHub Pages site under docs/ and the repository description, homepage and
# topics on github.com are both generated from this file by .github/seo/seo.py.
# Change a fact here, not in the generated blocks; CI fails the pull request when
# the two disagree.
#
#   python .github/seo/seo.py validate    # this file is well-formed and truthful
#   python .github/seo/seo.py build       # regenerate docs/
#   python .github/seo/seo.py verify      # quality gates over the built site

